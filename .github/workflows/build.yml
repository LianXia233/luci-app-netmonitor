name: Build luci-app-netmonitor

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# 注意：这里绝不能使用 PKG_NAME 作为变量名。
# OpenWrt 的包元数据扫描链路会把环境变量 PKG_NAME 传进每个包的 DUMP 子 make，
# 而 luci.mk 用 `PKG_NAME?=$(LUCI_NAME)` 推导包名——make 视环境变量为已定义，
# `?=` 不会覆盖，结果整个 luci feed 的包名都被钉成同一个值，
# Kconfig 出现上百个包共用一个 symbol，编译目标彻底消失。
env:
  NM_PKG: luci-app-netmonitor

jobs:
  build:
    name: ${{ matrix.format }} @ ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    container:
      # 官方 SDK 容器。本包 LUCI_PKGARCH=all，用 x86-64 SDK 编出的产物
      # 可直接安装到任意架构的设备。
      image: openwrt/sdk:${{ matrix.sdk }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.10 系列使用 opkg，产物为 .ipk
          - sdk: x86-64-24.10.8
            format: ipk
          # 25.12 系列使用 apk，产物为 .apk
          - sdk: x86-64-25.12.5
            format: apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.NM_PKG }}

      - name: Locate SDK and prepare package
        shell: sh
        run: |
          set -eu
          # 不同版本的官方镜像里 SDK 根目录位置不完全一致，这里统一探测
          SDK_DIR=""
          for d in /builder /home/build/openwrt /openwrt /sdk /root/openwrt; do
            if [ -x "$d/scripts/feeds" ]; then SDK_DIR="$d"; break; fi
          done
          if [ -z "$SDK_DIR" ]; then
            echo "::error::cannot locate OpenWrt SDK (scripts/feeds not found)"
            ls -la /
            exit 1
          fi
          # PKG_NAME 是 OpenWrt 元数据扫描链路的敏感变量，见文件头注释
          unset PKG_NAME || true
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK located at: $SDK_DIR"

          mkdir -p "$SDK_DIR/package"
          rm -rf "$SDK_DIR/package/$NM_PKG"
          cp -r "$GITHUB_WORKSPACE/$NM_PKG" "$SDK_DIR/package/$NM_PKG"

          # 源码里带的排障工作区不参与打包
          rm -rf "$SDK_DIR/package/$NM_PKG/tests/.tmp"

      - name: Update feeds and install LuCI dependencies
        shell: sh
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update -a

          # 只安装 luci feed：本包依赖全部落在 luci feed 与 SDK 自带组件内。
          # 不引入 packages feed 可缩小元数据解析面、缩短 defconfig 时间，
          # 同时避免无关包的 Kconfig 噪音干扰诊断输出。
          ./scripts/feeds install -a -p luci

          echo "==> installed feeds:"
          ls package/feeds/ 2>/dev/null || true
          echo "==> attendedsysupgrade 相关包是否仍在引入范围:"
          find package feeds -maxdepth 5 -name '*attendedsysupgrade*' -print 2>/dev/null || echo "    (none)"

      - name: Configure
        shell: sh
        run: |
          cd "$SDK_DIR"

          # defconfig 输出保留，用于判定 Kconfig 是否报递归依赖。
          # 注意：Config-build.in / Config.in 属于 Kconfig 输入，任何情况下都不能删除，
          # 删掉会导致后续报 `Config.in:153: glob failed: No files found "Config-build.in"`。
          set +e
          make defconfig 2>&1 | tee /tmp/defconfig.log
          set -e

          if grep -q 'recursive dependency detected' /tmp/defconfig.log; then
            echo "::warning::Kconfig recursive dependency detected, retrying with a clean tmp state"
            grep -n 'recursive dependency\|depends on PACKAGE\|is selected by' /tmp/defconfig.log | head -10 || true

            # 只清理可再生的生成物（tmp/ 下的索引与 Kconfig 产物）
            rm -f tmp/.packageinfo tmp/.packagedeps tmp/.config-package.in tmp/.config-target.in

            set +e
            make defconfig 2>&1 | tee /tmp/defconfig.log
            set -e
          fi

          echo "===== 诊断：包索引中的 netmonitor 条目 ====="
          echo "Package 行数: $(grep -c '^Package: luci-app-netmonitor$' tmp/.packageinfo 2>/dev/null || echo NA)"
          echo "----- .packageinfo 前 8 个 Package 行 -----"
          grep -n '^Package: ' tmp/.packageinfo 2>/dev/null | head -8 || true
          echo "----- 本包条目的上下文 -----"
          grep -n -A4 '^Package: luci-app-netmonitor$' tmp/.packageinfo 2>/dev/null | head -20 || true
          echo "===== 诊断：生成的 Kconfig ====="
          echo "config PACKAGE_luci-app-netmonitor 出现次数: $(grep -c 'config PACKAGE_luci-app-netmonitor$' tmp/.config-package.in 2>/dev/null || echo NA)"
          echo "----- tmp/.config-package.in 第 47300-47320 行原文 -----"
          sed -n '47300,47320p' tmp/.config-package.in 2>/dev/null || true
          echo "----- 引用 attendedsysupgrade-common 的行 -----"
          grep -n 'attendedsysupgrade-common' tmp/.config-package.in 2>/dev/null | head -10 || true
          echo "===== 诊断结束 ====="

          # 显式启用本包（conf 成功写出时该行已存在，此处仅作保证）
          sed -i '/^CONFIG_PACKAGE_luci-app-netmonitor=/d' .config 2>/dev/null || true
          echo 'CONFIG_PACKAGE_luci-app-netmonitor=y' >> .config

          # 不要单独启用/编译 i18n 子包：luci.mk 的 LuciTranslation 在编译主包时
          # 会顺带构建本包衍生的所有 i18n 包（luci-i18n-<basename>-<lang>，本包即
          # luci-i18n-netmonitor-zh-cn），但它**不会**为这些 i18n 子包注册独立的
          # package/luci-i18n-*/compile 目标。即便在 .config 写
          # CONFIG_PACKAGE_luci-i18n-netmonitor-zh-cn=y，`make package/<i18n>/compile`
          # 仍报 "No rule to make target"（8982168 之后的 CI 实证：i18n 的 .ipk/.apk
          # 由主包编译产出，单独编译目标永不生成）。因此 i18n 的产出校验放到 Build
          # 步骤（确认 bin/ 下确有对应 .ipk/.apk），而不是试图单独编译它。

          echo "target symbols: $(grep -c '^CONFIG_TARGET_' .config 2>/dev/null || echo 0)"

      - name: Build package and translations
        shell: sh
        run: |
          set -eu
          cd "$SDK_DIR"

          # Kconfig 未收敛时包索引不会生成，这里给出可定位的失败信息
          if [ ! -f tmp/.packageinfo ]; then
            echo "::error::tmp/.packageinfo missing - Kconfig did not converge"
            echo "----- .config head -----"
            sed -n '1,40p' .config 2>/dev/null || true
            exit 1
          fi
          echo "==> packageinfo entries for luci-app-netmonitor: $(grep -c '^Package: luci-app-netmonitor$' tmp/.packageinfo || true)"

          make package/$NM_PKG/compile V=s

          # i18n 翻译包由主包编译（luci.mk 的 LuciTranslation）顺带产出，luci.mk
          # 不会为 i18n 子包注册独立的 package/luci-i18n-*/compile 目标——
          # 直接 make 该目标必然 "No rule to make target"（8982168 之后的 CI 实证），
          # 故这里不单独编译。改为存在性校验：确认 tmp/.packageinfo 中扫描到的每个
          # i18n 包，都在 bin/ 下产出了对应 .ipk/.apk（apk 文件名用短横、ipk 用下划线
          # 分隔版本号，故两种命名一并匹配）。一旦未来 luci.mk 不再顺带构建 i18n，
          # 此步会立即以 ::error 暴露，而不是静默丢包。i18n 包名从 .packageinfo 推导，绝不手算。
          for i18n in $(grep -oE '^Package: luci-i18n-netmonitor-[A-Za-z0-9._-]+$' tmp/.packageinfo 2>/dev/null | sed 's/^Package: //'); do
            [ -z "$i18n" ] && continue
            found=$(find bin -type f \( -name "${i18n}*.ipk" -o -name "${i18n}*.apk" \) 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              echo "::error::translation package $i18n was scanned but no built artifact found under bin/"
              exit 1
            fi
            echo "==> i18n artifact present: $found"
          done

      - name: Collect artifacts
        id: collect
        shell: sh
        run: |
          set -eu
          cd "$SDK_DIR"
          DIST="$GITHUB_WORKSPACE/dist-${{ matrix.format }}"
          mkdir -p "$DIST"
          found=0
          for f in $(find bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
                     -name '*netmonitor*' 2>/dev/null); do
            cp "$f" "$DIST/"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::no packages produced"
            find bin -maxdepth 4 -type d | head -20
            exit 1
          fi
          echo "==> packages:"
          ls -la "$DIST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NM_PKG }}-${{ matrix.format }}
          path: dist-${{ matrix.format }}/*
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-${{ matrix.format }}/*
          generate_release_notes: true

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report
        run: |
          echo "ipk job : ${{ needs.build.result }}"
          echo "artifacts: luci-app-netmonitor-ipk / luci-app-netmonitor-apk"
